<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wearyourart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f6f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            transition: .3s;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .price {
            color: #0066ff;
            font-weight: 700;
        }

        .old-price {
            text-decoration: line-through;
            color: gray;
            font-size: 13px;
            margin-left: 5px;
        }

        .icons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }

        .icon:hover {
            background: #f1f3f7;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
        }
        @media(max-width:768px){
body{
padding:15px;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card img{
height:140px;
}
}

@media(max-width:480px){
.grid{
grid-template-columns:1fr;
}
}
    </style>

</head>

<body>

    <div class="container">

        <div class="title">Men & Women</div>

        <div class="grid">


            <!-- 50+ Cards -->
            <script>
                let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

                const products = [
                    "shirt1.jpeg",
                    "shirt2.jpeg",
                    "shirt3.jpeg",
                    "shirt4.jpeg",
                    "shirt5.jpeg",
                    "shirt6.jpeg",
                    "shirt7.jpeg",
                    "shirt8.jpeg",
                    "shirt9.jpeg",
                    "shirt10.jpeg",
                    "shirt11.jpeg",
                    "shirt12.jpeg",
                    "shirt13.jpeg",
                    "shirt14.jpeg",
                    "shirt15.jpeg",
                    "shirt16.jpeg",
                    "shirt17.jpeg",
                    "shirt18.jpeg",
                    "shirt19.jpeg",
                    "shirt20.jpeg",
                ];

                for (let i = 1; i <= 19; i++) {

                    document.write(`

<div class="card">

<div class="badge">-10%</div>

<img src="${products[i]}" />

<div class="card-title">
t-shirt
</div>



    <div class="icons">
   <div class="icon" onclick="toggleFavorite(${i + 1})">♡</div>
    <div class="icon" ><a href="#" onclick="openForm(${i + 1})" class="icon">
    🛒
    </a></div>
    </div>

    </div>

`)

                }
                let selectedProduct = null;

                function openForm(productId) {
                    selectedProduct = productId;
                    document.getElementById("formModal").style.display = "flex";
                }

                function closeForm() {
                    document.getElementById("formModal").style.display = "none";
                }

                function sendToWhatsApp() {

                    let nom = document.getElementById("nom").value;
                    let prenom = document.getElementById("prenom").value;
                    let ville = document.getElementById("ville").value;
                    let email = document.getElementById("email").value;
                    let phone = document.getElementById("phone").value;

                    if (!nom || !prenom || !ville || !email || !phone) {
                        alert("les informations sont obligatoire !!!");
                        return;
                    }

                    let message =
                        `Bonjour, je veux commander:

Produit: ${selectedProduct}
Nom: ${nom}
Prénom: ${prenom}
Ville: ${ville}
Email: ${email}
Téléphone: ${phone}`;

                    let url = "https://wa.me/212777042313?text=" + encodeURIComponent(message);

                    window.open(url, "_blank");

                    closeForm();
                }

            </script>



        </div>

    </div>

    <div id="formModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
    background:rgba(0,0,0,0.6); justify-content:center; align-items:center;">

        <div style="background:white; padding:20px; border-radius:10px; width:300px;">

            <h3>Remplir vos informations</h3>

            <input id="nom" placeholder="Nom" style="width:100%; margin:5px 0; padding:8px;">
            <input id="prenom" placeholder="Prénom" style="width:100%; margin:5px 0; padding:8px;">
            <input id="ville" placeholder="Ville" style="width:100%; margin:5px 0; padding:8px;">
            <input id="email" placeholder="Email" style="width:100%; margin:5px 0; padding:8px;">
            <input id="phone" placeholder="Téléphone" style="width:100%; margin:5px 0; padding:8px;">

            <button onclick="sendToWhatsApp()" style="margin-top:10px; padding:10px; width:100%;">
                Envoyer WhatsApp
            </button>

            <button onclick="closeForm()" style="margin-top:5px; padding:10px; width:100%; background:#eee;">
                Annuler
            </button>

        </div>

    </div>
</body>

</html>
