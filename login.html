<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2575fc;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2575fc;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Login</h2>

        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p>
            No account?
            <a href="signup.html">Sign up</a>
        </p>

    </div>

    <!-- Firebase -->
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5_NkBrN8gDM6u-Y78Na7Q0NW4nen7kiA",
            authDomain: "wearyourart-23f4b.firebaseapp.com",
            projectId: "wearyourart-23f4b",
            storageBucket: "wearyourart-23f4b.appspot.com",
            messagingSenderId: "402194512813",
            appId: "1:402194512813:web:ea428cdd526a95b4167f24"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = function () {

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Fill all fields");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("Welcome ✅");
                    window.location.href = "profile.html";
                })
                .catch(err => alert(err.message));

        }

    </script>

</body>

</html>
